<!DOCTYPE html>
<html>
<head>
    <title>Loan Risk Predictor + SHAP + LLM</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 30px; background: #f5f5f5; }
        .card {
            max-width: 520px;
            margin: auto;
            background: white;
            padding: 20px 25px;
            border-radius: 10px;
            box-shadow: 0 0 12px rgba(0,0,0,0.08);
        }
        input {
            width: 100%;
            padding: 8px;
            margin: 5px 0 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border-radius: 5px;
            border: none;
            background: #0066ff;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }
        button:hover { background: #004fcb; }
        #result, #explain-box {
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            background: #eef1ff;
        }
        .risk-low { color: green; }
        .risk-medium { color: orange; }
        .risk-high { color: red; }
        pre { background: #f0f0f0; padding: 8px; border-radius: 6px; overflow-x: auto; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="text-align:center;">Credit Risk Prediction</h2>

    <form id="riskForm">
        <input type="number" step="any" name="age" placeholder="Age" required>
        <input type="number" step="any" name="income" placeholder="Income" required>
        <input type="number" step="any" name="emp_length" placeholder="Employment Length (years)" required>
        <input type="number" step="any" name="amount" placeholder="Loan Amount" required>
        <input type="number" step="any" name="rate" placeholder="Interest Rate (%)" required>
        <input type="number" step="any" name="percent_income" placeholder="Percent of Income" required>
        <input type="number" step="any" name="cred_length" placeholder="Credit Length (years)" required>

        <button type="button" onclick="runPrediction()">Predict & Explain</button>
    </form>

    <div id="result" style="display:none;"></div>
    <div id="explain-box" style="display:none;"></div>
</div>

<script>
async function runPrediction() {
    const form = document.getElementById("riskForm");
    const formData = new FormData(form);

    // 1) Call /predict
    const predRes = await fetch("/predict", { method: "POST", body: formData });
    const predData = await predRes.json();

    if (predData.error) {
        document.getElementById("result").style.display = "block";
        document.getElementById("result").innerHTML = "<b>Error:</b> " + predData.error;
        return;
    }

    const resultDiv = document.getElementById("result");
    resultDiv.style.display = "block";

    let riskClass = "risk-low";
    if (predData.risk === "Medium") riskClass = "risk-medium";
    else if (predData.risk === "High") riskClass = "risk-high";

    resultDiv.innerHTML =
        `<b>Risk Level:</b> <span class="${riskClass}">${predData.risk}</span><br>
         <b>Default Probability:</b> ${predData.probability}`;

    // 2) Call /explain for SHAP + LLM explanation
    const explainRes = await fetch("/explain", { method: "POST", body: formData });
    const explainData = await explainRes.json();

    const explainDiv = document.getElementById("explain-box");
    explainDiv.style.display = "block";

    if (explainData.error) {
        explainDiv.innerHTML = "<b>Explanation Error:</b> " + explainData.error;
        return;
    }

    let shapJson = JSON.stringify(explainData.shap_values, null, 2);

    explainDiv.innerHTML =
        `<h3>Why did the model predict this?</h3>
         <p>${explainData.llm_explanation.replace(/\n/g, "<br>")}</p>
         <details style="margin-top:10px;">
             <summary>Raw SHAP values (debug)</summary>
             <pre>${shapJson}</pre>
         </details>`;
}
</script>

</body>
</html>
